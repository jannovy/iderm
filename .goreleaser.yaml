version: 2

project_name: iderm

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

homebrew_casks:
  - repository:
      owner: jannovy
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/jannovy/iderm
    description: Terminal PHP IDE with code navigation, git and a two-panel file manager
    commit_author:
      name: Jan Nový
      email: jan.novy@email.cz
    hooks:
      post:
        # The binary is not signed and notarized; let Gatekeeper run it.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/iderm"]
          end
